<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS-GN vanilla theming</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main>
      <dsgn-card padding="lg">
        <dsgn-heading slot="heading" heading-size="h3">
          A themed DS-GN card
        </dsgn-heading>
        <dsgn-stack slot="footer" gap="md">
          <dsgn-text
            >The purple button color and its rounded corners come from application
            overrides.</dsgn-text
          >
          <dsgn-button appearance="solid">Continue</dsgn-button>
        </dsgn-stack>
      </dsgn-card>
    </main>
  </body>
</html>
